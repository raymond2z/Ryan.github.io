<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Model Tester</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TensorFlow.js and Teachable Machine libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        .progress-bar-fill {
            transition: width 0.3s ease-in-out;
        }
        #label-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 selection:bg-blue-200">

    <main class="max-w-2xl mx-auto p-4 md:p-8 pt-12">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            
            <!-- Header -->
            <div class="bg-blue-600 p-6 text-white text-center">
                <h1 class="text-2xl font-bold mb-2">Image Classifier Tester</h1>
                <p class="text-blue-100 text-sm">Universal Teachable Machine Model Loader</p>
            </div>

            <div class="p-6 md:p-8">
                
                <!-- Setup View: URL Input -->
                <div id="setup-view" class="space-y-6">
                    <div class="space-y-2">
                        <label for="model-url" class="block text-sm font-semibold text-gray-700">Teachable Machine Sharable Link</label>
                        <div class="flex gap-2">
                            <input type="text" id="model-url" 
                                   value="https://teachablemachine.withgoogle.com/models/mA0-xbefQ/"
                                   placeholder="https://teachablemachine.withgoogle.com/models/..." 
                                   class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                            <button onclick="loadModelFromInput()" id="load-btn" 
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-50">
                                Load Model
                            </button>
                        </div>
                        <p class="text-xs text-gray-500">Paste the "Sharable Link" from your Teachable Machine project export tab.</p>
                    </div>

                    <div id="setup-status" class="hidden flex items-center gap-3 p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <div id="status-spinner" class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
                        <p id="status-text" class="text-sm font-medium text-gray-600">Checking model URL...</p>
                    </div>
                </div>

                <!-- Main Content View -->
                <div id="main-content" class="hidden space-y-6">
                    
                    <!-- Model Info Header -->
                    <div class="flex items-center justify-between border-b pb-4">
                        <div>
                            <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">Active Model</span>
                            <p id="loaded-url-display" class="text-sm text-gray-500 truncate max-w-[200px] md:max-w-xs"></p>
                        </div>
                        <button onclick="resetToSetup()" class="text-xs font-semibold text-red-600 hover:text-red-700 underline">Change Model</button>
                    </div>

                    <!-- Tabs -->
                    <div class="flex p-1 bg-gray-100 rounded-lg gap-1">
                        <button id="tab-webcam" onclick="switchTab('webcam')" class="flex-1 py-2 px-2 rounded-md text-xs sm:text-sm font-medium bg-white shadow-sm text-blue-600 transition-all">Webcam</button>
                        <button id="tab-upload" onclick="switchTab('upload')" class="flex-1 py-2 px-2 rounded-md text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">Upload</button>
                        <button id="tab-url" onclick="switchTab('url')" class="flex-1 py-2 px-2 rounded-md text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">Image URL</button>
                    </div>

                    <!-- Webcam Section -->
                    <div id="webcam-section" class="flex flex-col items-center space-y-4">
                        <div id="webcam-wrapper" class="w-full max-w-[400px] aspect-square bg-gray-900 rounded-xl overflow-hidden flex items-center justify-center relative shadow-inner">
                            <p id="webcam-placeholder" class="text-gray-400 text-sm absolute">Camera off</p>
                        </div>
                        <button id="webcam-btn" onclick="toggleWebcam()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-md flex items-center gap-2">
                            Start Webcam
                        </button>
                    </div>

                    <!-- Upload Section -->
                    <div id="upload-section" class="hidden flex-col items-center space-y-4">
                        <div class="w-full max-w-[400px] aspect-square bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl overflow-hidden flex flex-col items-center justify-center relative hover:bg-gray-50 transition-colors group cursor-pointer" onclick="document.getElementById('file-upload').click()">
                            <img id="preview-image" crossorigin="anonymous" class="absolute inset-0 w-full h-full object-contain hidden bg-white" alt="Preview">
                            <div id="preview-placeholder" class="flex flex-col items-center text-gray-500 group-hover:text-blue-500 transition-colors">
                                <span class="text-sm font-medium text-center px-4">Click to upload image</span>
                            </div>
                            <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
                        </div>
                    </div>

                    <!-- Image URL Section -->
                    <div id="url-section" class="hidden flex-col items-center space-y-4">
                        <div class="w-full space-y-3">
                            <div class="flex gap-2">
                                <input type="text" id="img-direct-url" 
                                       placeholder="Paste image link (e.g. Pokemon image)..." 
                                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <button onclick="loadImageFromUrl(false)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Load</button>
                            </div>
                            <div id="url-preview-wrapper" class="w-full max-w-[400px] mx-auto aspect-square bg-gray-100 border rounded-xl overflow-hidden flex flex-col items-center justify-center relative p-4">
                                <img id="url-preview-image" crossorigin="anonymous" class="absolute inset-0 w-full h-full object-contain hidden bg-white" alt="URL Preview">
                                <div id="url-error-container" class="hidden text-center space-y-3">
                                    <p id="url-preview-placeholder" class="text-red-500 text-xs font-medium px-4"></p>
                                    <button id="proxy-btn" onclick="loadImageFromUrl(true)" class="text-xs bg-gray-800 text-white px-3 py-1.5 rounded hover:bg-black transition-colors">
                                        Try via CORS Proxy
                                    </button>
                                </div>
                                <div id="url-empty-placeholder" class="text-gray-400 text-sm">No image loaded</div>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200">

                    <!-- Predictions -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Predictions</h3>
                        <div id="label-container" class="space-y-4"></div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script type="text/javascript">
        let model, webcam, maxPredictions, isWebcamActive = false, animationId, currentMode = 'webcam'; 

        const setupView = document.getElementById('setup-view'), setupStatus = document.getElementById('setup-status'), 
              statusText = document.getElementById('status-text'), statusSpinner = document.getElementById('status-spinner'),
              modelUrlInput = document.getElementById('model-url'), loadBtn = document.getElementById('load-btn'),
              mainContent = document.getElementById('main-content'), labelContainer = document.getElementById('label-container'),
              webcamWrapper = document.getElementById('webcam-wrapper'), webcamBtn = document.getElementById('webcam-btn'),
              previewImage = document.getElementById('preview-image'), previewPlaceholder = document.getElementById('preview-placeholder'),
              urlPreviewImage = document.getElementById('url-preview-image'), urlErrorContainer = document.getElementById('url-error-container'),
              urlPreviewPlaceholder = document.getElementById('url-preview-placeholder'), urlEmptyPlaceholder = document.getElementById('url-empty-placeholder'),
              imgDirectUrlInput = document.getElementById('img-direct-url'), loadedUrlDisplay = document.getElementById('loaded-url-display');

        async function loadModelFromInput() {
            let url = modelUrlInput.value.trim();
            if (!url) return;
            if (!url.endsWith('/')) url += '/';

            setupStatus.classList.remove('hidden');
            statusText.textContent = "Connecting to Teachable Machine...";
            statusText.classList.remove('text-red-600');
            statusSpinner.classList.remove('hidden');
            loadBtn.disabled = true;

            try {
                model = await tmImage.load(url + "model.json", url + "metadata.json");
                maxPredictions = model.getTotalClasses();
                setupPredictionUI();
                setupView.classList.add('hidden');
                mainContent.classList.remove('hidden');
                loadedUrlDisplay.textContent = url;
            } catch (error) {
                statusText.textContent = "Error: Invalid link or access blocked.";
                statusText.classList.add('text-red-600');
                statusSpinner.classList.add('hidden');
                loadBtn.disabled = false;
            }
        }

        function resetToSetup() {
            if (isWebcamActive) stopWebcam();
            mainContent.classList.add('hidden');
            setupView.classList.remove('hidden');
            setupStatus.classList.add('hidden');
            loadBtn.disabled = false;
        }

        function setupPredictionUI() {
            labelContainer.innerHTML = ''; 
            for (let i = 0; i < maxPredictions; i++) {
                const classLabel = model.getClassLabels()[i];
                labelContainer.insertAdjacentHTML('beforeend', `
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="text-sm font-medium text-gray-700">${classLabel}</span>
                            <span id="prob-text-${i}" class="text-sm font-bold text-gray-900">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div id="prob-bar-${i}" class="bg-blue-600 h-2.5 rounded-full progress-bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                `);
            }
        }

        function updatePredictionUI(predictions) {
            for (let i = 0; i < maxPredictions; i++) {
                const probability = (predictions[i].probability * 100).toFixed(1);
                const textElem = document.getElementById(`prob-text-${i}`);
                const barElem = document.getElementById(`prob-bar-${i}`);
                if (textElem && barElem) {
                    textElem.innerText = `${probability}%`;
                    barElem.style.width = `${probability}%`;
                    barElem.className = probability > 75 ? "bg-green-500 h-2.5 rounded-full progress-bar-fill" : (probability < 15 ? "bg-gray-400 h-2.5 rounded-full progress-bar-fill" : "bg-blue-600 h-2.5 rounded-full progress-bar-fill");
                }
            }
        }

        async function switchTab(tab) {
            if (currentMode === tab) return;
            currentMode = tab;
            ['webcam', 'upload', 'url'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`), sec = document.getElementById(`${t}-section`);
                btn.className = t === tab ? "flex-1 py-2 px-2 rounded-md text-xs sm:text-sm font-medium bg-white shadow-sm text-blue-600 transition-all" : "flex-1 py-2 px-2 rounded-md text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 transition-all";
                sec.classList.toggle('hidden', t !== tab);
            });
            if (isWebcamActive && tab !== 'webcam') stopWebcam();
            if (tab === 'upload' && !previewImage.hidden) predictImage(previewImage);
            if (tab === 'url' && !urlPreviewImage.hidden) predictImage(urlPreviewImage);
        }

        async function toggleWebcam() { if (isWebcamActive) stopWebcam(); else startWebcam(); }

        async function startWebcam() {
            webcamBtn.innerHTML = 'Starting...';
            webcam = new tmImage.Webcam(400, 400, true);
            try {
                await webcam.setup();
                await webcam.play();
                webcamWrapper.innerHTML = '';
                webcam.canvas.classList.add('w-full', 'h-full', 'object-cover');
                webcamWrapper.appendChild(webcam.canvas);
                isWebcamActive = true;
                webcamBtn.innerHTML = 'Stop Webcam';
                webcamBtn.classList.replace('bg-blue-600', 'bg-red-600');
                loop();
            } catch (err) {
                webcamBtn.innerHTML = "Camera Denied";
            }
        }

        function stopWebcam() {
            if (webcam) webcam.stop();
            cancelAnimationFrame(animationId);
            webcamWrapper.innerHTML = `<p class="text-gray-400 text-sm absolute">Camera off</p>`;
            webcamBtn.innerHTML = 'Start Webcam';
            webcamBtn.classList.replace('bg-red-600', 'bg-blue-600');
            isWebcamActive = false;
        }

        async function loop() {
            if (isWebcamActive) {
                webcam.update(); 
                updatePredictionUI(await model.predict(webcam.canvas));
                animationId = window.requestAnimationFrame(loop);
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                    previewPlaceholder.classList.add('hidden');
                    previewImage.onload = () => predictImage(previewImage);
                };
                reader.readAsDataURL(file);
            }
        }

        function loadImageFromUrl(useProxy = false) {
            let url = imgDirectUrlInput.value.trim();
            if (!url) return;
            
            urlEmptyPlaceholder.classList.add('hidden');
            urlErrorContainer.classList.add('hidden');
            urlPreviewImage.classList.add('hidden');

            // Use a simple public CORS proxy if requested
            const finalUrl = useProxy ? `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` : url;
            
            urlPreviewImage.src = finalUrl;
            urlPreviewImage.onload = () => {
                urlPreviewImage.classList.remove('hidden');
                predictImage(urlPreviewImage);
            };
            urlPreviewImage.onerror = () => {
                urlErrorContainer.classList.remove('hidden');
                urlPreviewPlaceholder.textContent = useProxy ? "CORS Proxy failed. This site is very restricted." : "Access Blocked (CORS). This website doesn't allow direct pixel reading.";
            };
        }

        async function predictImage(img) {
            if (model && img.src) {
                try { updatePredictionUI(await model.predict(img)); }
                catch (e) {
                    urlPreviewImage.classList.add('hidden');
                    urlErrorContainer.classList.remove('hidden');
                    urlPreviewPlaceholder.textContent = "CORS Error: The browser cannot 'read' this image's pixels.";
                }
            }
        }

        window.addEventListener('load', () => { if (modelUrlInput.value) loadModelFromInput(); });
    </script>
</body>
</html>
