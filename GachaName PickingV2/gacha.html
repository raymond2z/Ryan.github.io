<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Picker & Group Gen</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- 1. Global Variables --- */
        :root {
            --bg-color: #FFC045;       
            --machine-red: #FF4757;    
            --machine-dark: #2F3542;   
            --knob-color: #ECCC68;     
            --accent-green: #2ED573;   
            --accent-blue: #1E90FF;    
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#F6B93B 20%, transparent 20%),
                              radial-gradient(#F6B93B 20%, transparent 20%);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; flex-direction: column; padding: 20px;
            overflow: hidden;
            color: var(--machine-dark);
        }

        h1 { 
            color: #FFFFFF; 
            margin-bottom: 20px; 
            font-size: 2.5rem;
            text-shadow: 4px 4px 0px var(--machine-dark);
            background: var(--machine-red);
            padding: 10px 30px;
            border-radius: 50px;
            border: 4px solid var(--machine-dark);
            transform: rotate(-2deg);
            z-index: 10;
        }

        /* --- 2. Start Overlay --- */
        .start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(47, 53, 66, 0.95); z-index: 999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; cursor: pointer; transition: opacity 0.5s;
            text-align: center;
        }
        .start-btn {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.5em; padding: 15px 40px; 
            background: var(--accent-green); color: white; 
            border: 4px solid white;
            border-radius: 50px; cursor: pointer; 
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* --- 3. Main Layout --- */
        .layout { 
            display: flex; gap: 40px; align-items: flex-start; 
            flex-wrap: wrap; justify-content: center; 
        }

        /* --- Machine Styles --- */
        .machine-container {
            position: relative; 
            width: 380px; 
            height: 580px; 
            display: flex; flex-direction: column; align-items: center;
            user-select: none;
            filter: drop-shadow(8px 8px 0px rgba(0,0,0,0.2));
        }

        .globe {
            width: 320px; 
            height: 320px; 
            background: rgba(255, 255, 255, 0.4);
            border: 6px solid var(--machine-dark);
            border-radius: 50%;
            position: relative; z-index: 2; overflow: hidden;
            margin-bottom: -50px;
            background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.2) 100%);
        }
        
        .globe::after {
            content: ''; position: absolute;
            top: 25px; left: 25px; width: 80px; height: 40px;
            background: white; border-radius: 50%;
            transform: rotate(-45deg); opacity: 0.6;
        }

        .ball {
            width: 40px; height: 40px; border-radius: 50%;
            position: absolute; 
            border: 3px solid rgba(0,0,0,0.1);
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.1);
            transition: transform 0.3s ease-out, bottom 0.3s ease-out, left 0.3s ease-out;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: 900; color: rgba(255,255,255,0.9);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }

        .base {
            width: 340px; height: 260px;
            background-color: var(--machine-red);
            border: 6px solid var(--machine-dark);
            border-radius: 30px 30px 40px 40px;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: inset 0 -15px 0 rgba(0,0,0,0.2);
        }

        .panel-bg {
            position: absolute; top: 60px; width: 240px; height: 130px;
            background: white; border: 4px solid var(--machine-dark);
            border-radius: 20px;
        }

        .controls {
            position: relative; top: 55px; z-index: 5;
            width: 100%; display: flex; justify-content: center;
        }
        .knob {
            width: 100px; height: 100px;
            background: var(--knob-color);
            border: 5px solid var(--machine-dark);
            border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .knob:active { transform: scale(0.95) translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .knob-bar {
            width: 90%; height: 20px; background: white;
            border: 3px solid var(--machine-dark); border-radius: 10px;
        }

        .exit {
            width: 140px; height: 50px;
            background: var(--machine-dark);
            border-radius: 0 0 20px 20px;
            margin-top: auto; margin-bottom: 25px;
            position: relative;
        }
        .exit::after {
            content: ''; position: absolute;
            top: 5px; left: 10px; width: 120px; height: 20px;
            background: #57606F; border-radius: 10px;
        }

        .prize-ball {
            width: 60px; height: 60px; border-radius: 50%;
            position: absolute; left: 50%; transform: translateX(-50%);
            top: 20px; opacity: 0;
            border: 4px solid rgba(0,0,0,0.2);
            z-index: 3;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; color: white;
        }

        /* --- 4. Sidebar / Utility Panel --- */
        .utility-column {
            background: white; padding: 20px; 
            border: 6px solid var(--machine-dark);
            border-radius: 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            width: 320px; min-height: 580px;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .utility-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px dashed #ddd; padding-bottom: 10px;
        }
        .utility-header h3 { margin: 0; font-size: 1.2rem; }
        .count-badge { background: var(--machine-dark); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 5px; }
        
        .action-btn {
            flex: 1; padding: 8px; border: 3px solid var(--machine-dark);
            border-radius: 10px; font-weight: bold; cursor: pointer;
            font-family: inherit; box-shadow: 2px 2px 0 var(--machine-dark);
            transition: transform 0.1s; font-size: 13px;
        }
        .action-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-red { background: var(--machine-red); color: white; }

        /* List Styling */
        .list-container {
            border: 2px solid #eee; border-radius: 10px;
            padding: 5px; background: #f9f9f9;
            flex: 1; overflow-y: auto; max-height: 200px;
        }
        
        .list-item {
            padding: 5px; border-bottom: 1px solid #eee; font-size: 13px;
            display: flex; align-items: center;
        }
        .list-num { 
            background: var(--machine-dark); color: white; 
            width: 20px; height: 20px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center;
            margin-right: 8px; font-size: 10px; font-weight: bold;
        }
        
        .list-section-title {
            font-size: 14px; font-weight: bold; color: #888; margin-top: 10px; border-bottom: 2px solid #eee;
        }

        /* --- 5. Modals --- */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); display: none; 
            justify-content: center; align-items: center; z-index: 1000; 
            backdrop-filter: blur(5px);
        }
        .modal-card { 
            background: #FFF; padding: 0; 
            border: 6px solid var(--machine-dark); 
            border-radius: 20px; text-align: center; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            width: 350px; overflow: hidden;
            box-shadow: 15px 15px 0 rgba(0,0,0,0.2);
        }
        .modal-header { background: var(--accent-green); padding: 15px; border-bottom: 4px solid var(--machine-dark); }
        .modal-body { padding: 30px 20px; }
        .input-area { width: 90%; height: 200px; margin: 10px 0; padding: 10px; border: 3px solid var(--machine-dark); border-radius: 10px; font-family: inherit; font-size: 14px; }
        .close-btn { 
            background: var(--machine-red); color: white; border: 4px solid var(--machine-dark); 
            padding: 10px 30px; border-radius: 50px; cursor: pointer; margin-top: 20px;
            font-size: 1.2rem; font-weight: bold; font-family: inherit;
            box-shadow: 4px 4px 0 var(--machine-dark);
        }
        .close-btn:active { transform: translate(4px, 4px); box-shadow: none; }

        /* --- 6. Animations --- */
        @keyframes hardShake {
            0% { transform: translate(0, 0) rotate(0); }
            25% { transform: translate(-8px, 8px) rotate(-5deg); }
            50% { transform: translate(8px, -8px) rotate(5deg); }
            75% { transform: translate(-8px, -8px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0); }
        }
        @keyframes chaos-1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-30px, -60px) rotate(-90deg); }
            50% { transform: translate(20px, -20px) rotate(-180deg); }
            75% { transform: translate(-10px, -70px) rotate(-270deg); }
            100% { transform: translate(0, 0) rotate(-360deg); }
        }
        @keyframes chaos-2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -50px) rotate(90deg); }
            50% { transform: translate(-20px, -80px) rotate(180deg); }
            75% { transform: translate(10px, -20px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        @keyframes chaos-3 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(0px, -90px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        @keyframes chaos-4 {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-20px, -40px) rotate(-120deg); }
            66% { transform: translate(20px, -40px) rotate(-240deg); }
            100% { transform: translate(0, 0) rotate(-360deg); }
        }
        @keyframes continuousSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0.5) rotate(-10deg); opacity: 0; } 80% { transform: scale(1.1) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }

        .is-shaking { animation: hardShake 0.1s infinite; }
        .is-rotating { animation: continuousSpin 0.5s linear infinite; }
        .prize-ball.dropped { top: 120px; opacity: 1; transform: translateX(-50%) rotate(360deg); }

        .group-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 300px; overflow-y: auto; padding: 10px; }
        .group-card { border: 3px solid var(--machine-dark); border-radius: 10px; width: 140px; background: #f1f2f6; overflow: hidden; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .group-title { background: var(--knob-color); padding: 5px; font-weight: bold; font-size: 14px; border-bottom: 2px solid var(--machine-dark); }
        .group-list { padding: 8px; font-size: 13px; text-align: left; }
    </style>
</head>
<body>

    <div class="start-overlay" id="startOverlay" onclick="initGame()">
        <h1 style="transform: none; border: none; background: none; font-size: 3rem;">Student Picker</h1>
        <p>Gacha Style & Group Generator</p>
        <button class="start-btn">Click to Start</button>
        <p style="margin-top: 20px; opacity: 0.8; font-size: 14px;">(Requires coins.wav, shake.mp3...)</p>
    </div>

    <h1>Student Picker</h1>

    <div class="layout">
        <div class="machine-container" id="machine">
            <div class="globe" id="globe"></div>
            <div class="base">
                <div class="panel-bg"></div>
                <div class="controls">
                    <div class="knob" id="drawBtn" onclick="playGacha()">
                        <div class="knob-bar"></div>
                    </div>
                </div>
                <p style="color: var(--machine-dark); font-weight:bold; font-size: 16px; margin-top: 90px; z-index:5;">PICK ONE</p>
                <div class="exit"></div>
                <div class="prize-ball" id="prizeBall"></div>
            </div>
        </div>

        <div class="utility-column">
            <div class="btn-group">
                <button class="action-btn btn-blue" onclick="openImportModal()">✏️ Setup</button>
                <button class="action-btn btn-green" onclick="openGroupModal()">👥 Groups</button>
                <button class="action-btn btn-red" onclick="resetPicking()">🔄 Reset</button>
            </div>

            <div class="utility-header" style="margin-top:10px;">
                <h3>In Machine</h3>
                <span class="count-badge" id="remainingCount">0</span>
            </div>
            <div class="list-container" id="studentListDisplay"></div>

            <div class="utility-header" style="margin-top:10px; border-bottom: 4px dashed #ffaaa5;">
                <h3>Picked</h3>
                <span class="count-badge" id="pickedCount" style="background:#FF4757;">0</span>
            </div>
            <div class="list-container" id="pickedListDisplay" style="background: #fff0f0;">
                <div style="padding:10px; text-align:center; color:#999; font-size:12px;">No one picked yet</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 style="margin:0; color:var(--machine-dark);">✨ The Chosen One</h2>
            </div>
            <div class="modal-body">
                <div id="resultNumber" style="font-size:1.2em; color:#666; font-weight:bold;">No. ?</div>
                <div id="resultName" style="font-size:2.5em; font-weight:900; color:var(--machine-dark); margin: 10px 0;">Name</div>
                <button class="close-btn" onclick="closeModal('resultModal')">Awesome!</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="importModal">
        <div class="modal-card" style="width: 400px;">
            <div class="modal-header" style="background: var(--accent-blue); color:white;">
                <h2 style="margin:0;">📝 Class Setup</h2>
            </div>
            <div class="modal-body">
                <p style="font-size: 0.9em; text-align: left; margin-bottom: 5px;">Paste list (Format: "Number Name"):</p>
                <textarea id="importText" class="input-area" placeholder="1 Harry Potter&#10;2 Hermione Granger"></textarea>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button class="action-btn btn-green" onclick="saveStudents()">Save List</button>
                    <button class="action-btn btn-yellow" onclick="closeModal('importModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal-card" style="width: 600px;">
            <div class="modal-header" style="background: var(--knob-color);">
                <h2 style="margin:0;">👥 Group Generator</h2>
            </div>
            <div class="modal-body">
                <div id="groupControls">
                    <label>Per Group:</label>
                    <input type="number" id="groupSize" value="4" min="2" style="padding:5px; border:2px solid var(--machine-dark); border-radius:5px; width:50px; font-weight:bold; font-size:16px;">
                    <button class="action-btn btn-blue" style="padding:5px 15px;" onclick="generateGroups()">Generate</button>
                </div>
                <div id="groupResults" class="group-container" style="margin-top:15px;">
                    <div style="color:#888; margin-top:20px;">Set size and click Generate</div>
                </div>
                <button class="close-btn" onclick="closeModal('groupModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Audio Setup ---
        // PLEASE RENAME YOUR FILES TO LOWERCASE: coins.wav, shake.mp3, drop.mp3, win.mp3
        const soundCoin = new Audio('coins.wav');
        const soundShake = new Audio('shake.mp3');
        const soundDrop = new Audio('drop.mp3');
        const soundWin = new Audio('win.mp3');
        soundShake.loop = true;

        // --- 2. Configuration & State ---
        const colors = [
            '#FF6B81', '#7BED9F', '#70A1FF', '#FFA502', '#5352ED', 
            '#FF4757', '#2ED573', '#1E90FF', '#3742fa', '#2f3542', 
            '#e1b12c', '#00d2d3', '#ff7f50', '#a29bfe', '#fd79a8', 
            '#6c5ce7', '#00cec9', '#fab1a0', '#ffeaa7', '#d63031'
        ];

        let allStudents = [
            { num: '1', name: 'Alice', color: '#FF6B81' },
            { num: '2', name: 'Bob', color: '#70A1FF' },
            { num: '3', name: 'Charlie', color: '#FFA502' },
            { num: '4', name: 'Diana', color: '#7BED9F' },
            { num: '5', name: 'Ethan', color: '#5352ED' }
        ];

        // State for picking logic
        let remainingStudents = [];
        let pickedStudents = [];
        let isSpinning = false;

        // --- 3. Initialization ---
        function initGame() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            ctx.resume().then(() => {
                document.getElementById('startOverlay').style.opacity = '0';
                setTimeout(() => { document.getElementById('startOverlay').style.display = 'none'; }, 500);
            });
            loadStudents();
        }

        function loadStudents() {
            const saved = localStorage.getItem('classData');
            if (saved) {
                allStudents = JSON.parse(saved);
            }
            // Reset state on load
            remainingStudents = [...allStudents];
            pickedStudents = [];
            
            updateUI();
        }

        // --- 4. Render Functions ---
        function updateUI() {
            renderMachineBalls();
            renderLists();
        }

        function renderMachineBalls() {
            const globe = document.getElementById('globe');
            globe.innerHTML = '';
            
            // Empty state (all picked or no students loaded)
            if (remainingStudents.length === 0) {
                return; // Machine is empty
            }

            // Cap visual balls to 25 to avoid overcrowding
            const visualCount = Math.min(remainingStudents.length, 25);
            for(let i=0; i<visualCount; i++) {
                let student = remainingStudents[i % remainingStudents.length];
                let color = student.color || colors[i % colors.length];
                createBall(i, student.num, color);
            }

            function createBall(index, text, color) {
                let randRot = Math.random() * 360;
                let randLeft = (Math.random() * 20) - 10; 
                let randBottom = (Math.random() * 10);
                
                let animType = Math.ceil(Math.random() * 4); 
                
                let ball = document.createElement('div');
                ball.className = `ball mix-type-${animType}`;
                ball.style.background = color;
                
                // Static Pile Positions
                ball.style.left = `${40 + (index % 6) * 45 + randLeft}px`;
                ball.style.bottom = `${15 + Math.floor(index / 6) * 35 + randBottom}px`; 
                
                ball.style.zIndex = index;
                ball.style.transform = `rotate(${randRot}deg)`;
                ball.style.animationDuration = `${0.5 + Math.random() * 0.4}s`;
                
                if(text) ball.innerText = text;
                globe.appendChild(ball);
            }
        }

        function renderLists() {
            // Update Counts
            document.getElementById('remainingCount').innerText = remainingStudents.length;
            document.getElementById('pickedCount').innerText = pickedStudents.length;

            // Render Remaining List
            const listRemain = document.getElementById('studentListDisplay');
            if(remainingStudents.length === 0) {
                listRemain.innerHTML = '<div style="padding:10px; text-align:center; color:#999; font-size:12px;">Machine Empty</div>';
            } else {
                let html = '';
                remainingStudents.forEach(s => {
                    html += `<div class="list-item">
                            <div class="list-num" style="background:${s.color}">${s.num}</div>
                            <div style="font-weight:bold;">${s.name}</div>
                        </div>`;
                });
                listRemain.innerHTML = html;
            }

            // Render Picked List
            const listPicked = document.getElementById('pickedListDisplay');
            if(pickedStudents.length === 0) {
                listPicked.innerHTML = '<div style="padding:10px; text-align:center; color:#999; font-size:12px;">No one picked yet</div>';
            } else {
                let html = '';
                // Show latest picked on top
                [...pickedStudents].reverse().forEach(s => {
                    html += `<div class="list-item" style="opacity:0.7;">
                            <div class="list-num" style="background:#ccc;">${s.num}</div>
                            <div style="font-weight:bold; color:#666; text-decoration:line-through;">${s.name}</div>
                        </div>`;
                });
                listPicked.innerHTML = html;
            }
        }

        // --- 5. Import & Group Logic ---
        function openImportModal() {
            const text = allStudents.map(s => `${s.num} ${s.name}`).join('\n');
            document.getElementById('importText').value = text;
            document.getElementById('importModal').style.display = 'flex';
        }

        function saveStudents() {
            const text = document.getElementById('importText').value;
            const lines = text.split('\n');
            const newStudents = [];

            lines.forEach((line, index) => {
                const cleanLine = line.trim();
                if(cleanLine) {
                    const parts = cleanLine.split(/[\s\t]+/);
                    let num, name;
                    if(parts.length > 1 && /^\d+$/.test(parts[0].replace('.',''))) {
                         num = parts[0].replace('.','');
                         name = parts.slice(1).join(' ');
                    } else {
                        num = index + 1;
                        name = cleanLine;
                    }
                    newStudents.push({
                        num: num, name: name,
                        color: colors[index % colors.length]
                    });
                }
            });

            if(newStudents.length > 0) {
                allStudents = newStudents;
                remainingStudents = [...allStudents]; // Reset picking on new import
                pickedStudents = [];
                localStorage.setItem('classData', JSON.stringify(allStudents));
                updateUI();
                closeModal('importModal');
            } else {
                alert("Please enter at least one name!");
            }
        }

        function resetPicking() {
            if(confirm("Put all balls back in the machine?")) {
                remainingStudents = [...allStudents];
                pickedStudents = [];
                updateUI();
            }
        }

        function openGroupModal() { document.getElementById('groupModal').style.display = 'flex'; }

        function generateGroups() {
            if(allStudents.length < 2) { alert("Not enough students!"); return; }
            const size = parseInt(document.getElementById('groupSize').value);
            const shuffled = [...allStudents].sort(() => 0.5 - Math.random());
            const groups = [];
            while(shuffled.length > 0) groups.push(shuffled.splice(0, size));

            let html = '';
            groups.forEach((group, index) => {
                html += `<div class="group-card"><div class="group-title">Group ${index + 1}</div><div class="group-list">`;
                group.forEach(s => { html += `<div style="margin-bottom:2px;"><span style="color:${s.color}">●</span> ${s.name}</div>`; });
                html += `</div></div>`;
            });
            document.getElementById('groupResults').innerHTML = html;
        }

        // --- 6. Gameplay Logic ---
        function playGacha() {
            if (isSpinning) return;
            if (remainingStudents.length === 0) {
                if(allStudents.length === 0) alert("Please add students first!");
                else alert("All students have been picked! Click Reset to start over.");
                return;
            }
            isSpinning = true;

            const globe = document.getElementById('globe');
            const knob = document.getElementById('drawBtn');
            const prizeBall = document.getElementById('prizeBall');
            
            soundCoin.currentTime = 0; soundCoin.play();
            
            globe.classList.add('is-shaking');
            globe.classList.add('is-mixing');
            knob.classList.add('is-rotating');

            soundShake.currentTime = 0; soundShake.play();

            setTimeout(() => {
                soundShake.pause();
                globe.classList.remove('is-shaking');
                globe.classList.remove('is-mixing');
                knob.classList.remove('is-rotating');
                
                // LOGIC: Pick from REMAINING, remove it, add to PICKED
                const randomIndex = Math.floor(Math.random() * remainingStudents.length);
                const winner = remainingStudents[randomIndex];
                
                // Remove from remaining array
                remainingStudents.splice(randomIndex, 1);
                // Add to picked array
                pickedStudents.push(winner);

                // Update UI (Balls decrease immediately)
                renderMachineBalls();
                renderLists();
                
                soundDrop.currentTime = 0; soundDrop.play();

                prizeBall.style.backgroundColor = winner.color;
                prizeBall.style.border = "4px solid rgba(0,0,0,0.2)";
                prizeBall.innerText = winner.num;
                prizeBall.classList.add('dropped');

                setTimeout(() => {
                    soundWin.currentTime = 0; soundWin.play();
                    document.getElementById('resultNumber').innerText = `No. ${winner.num}`;
                    document.getElementById('resultNumber').style.color = winner.color;
                    document.getElementById('resultName').innerText = winner.name;
                    document.getElementById('resultName').style.color = winner.color;
                    document.getElementById('resultModal').style.display = 'flex';
                }, 800);
            }, 3000);
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            if(id === 'resultModal') {
                const prizeBall = document.getElementById('prizeBall');
                prizeBall.classList.remove('dropped');
                soundWin.pause();
                setTimeout(() => { isSpinning = false; }, 300);
            }
        }
    </script>

        .is-mixing .ball.mix-type-1 { animation: chaos-1 0.6s infinite linear; }
        .is-mixing .ball.mix-type-2 { animation: chaos-2 0.7s infinite linear; }
        .is-mixing .ball.mix-type-3 { animation: chaos-3 0.5s infinite linear; }
        .is-mixing .ball.mix-type-4 { animation: chaos-4 0.65s infinite linear; }
    </style>
