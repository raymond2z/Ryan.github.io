name: Build and Verify Rust WASM
on:
  push:
    branches:
      - main
      - airflow-lab-rust-wasm-engine-20261009
      - airflow-lab-student-wasm-20261009
    paths:
      - 'airflow-lab/rust/src/**'
      - 'airflow-lab/rust/Cargo.toml'
      - 'airflow-lab/wasm-integration.test.mjs'
      - 'airflow-lab/student-wasm*'
      - 'airflow-lab/student-wasm-worker.mjs'
      - 'airflow-lab/app.mjs'
      - 'airflow-lab/index.html'
      - '.github/workflows/airflow-rust-wasm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Rust solver natively
        run: cargo test --manifest-path airflow-lab/rust/Cargo.toml --release
      - name: Compile WASM
        run: cargo build --manifest-path airflow-lab/rust/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Place WASM artifact
        run: |
          mkdir -p airflow-lab/rust
          cp airflow-lab/rust/target/wasm32-unknown-unknown/release/airflow_solver.wasm airflow-lab/rust/airflow_solver.wasm
          ls -lh airflow-lab/rust/airflow_solver.wasm
      - name: Check numerical agreement with JavaScript
        run: node --test airflow-lab/wasm-integration.test.mjs
      - name: Verify existing benchmark tests
        run: node --test airflow-lab/benchmark.test.mjs
      - name: Verify live Student Lab worker integration
        run: node --test airflow-lab/student-wasm-integration.test.mjs
      - name: Validate Student Lab module syntax
        run: |
          node --check airflow-lab/app.mjs
          node --check airflow-lab/student-wasm-worker.mjs
      - name: Commit tested WASM binary to same branch for GitHub Pages
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add airflow-lab/rust/airflow_solver.wasm
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Rust WASM solver [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
