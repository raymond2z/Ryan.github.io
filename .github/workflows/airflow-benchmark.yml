name: Airflow Benchmark Checks
on:
  push:
    paths:
      - 'airflow-lab/**'
      - '.github/workflows/airflow-benchmark.yml'
  pull_request:
    paths:
      - 'airflow-lab/**'
      - '.github/workflows/airflow-benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check airflow-lab/benchmark.mjs
          node --check airflow-lab/benchmark-core.mjs
          node --check airflow-lab/benchmark-worker.mjs
          node --check airflow-lab/simulation.mjs
          node --check airflow-lab/gpu-engine.mjs
          node --check airflow-lab/gpu-worker.mjs
          node --check airflow-lab/gpu-probe-ui.mjs
          node --check airflow-lab/gpu-solver.mjs
          node --check airflow-lab/gpu-relative-force.mjs
          node --check airflow-lab/gpu-solver-ui.mjs
          node --check airflow-lab/gpu-solver-worker.mjs
          node --check airflow-lab/student-gpu-worker-v1.mjs
          node --check airflow-lab/student-gpu-worker-v2.mjs
          node --check airflow-lab/student-gpu-worker-v3.mjs
          node --check airflow-lab/live-performance.mjs
          node --check airflow-lab/gpu-experiment.mjs
          node --check airflow-lab/stability-recorder.mjs
          node --check airflow-lab/shape-comparison.mjs
          node --check airflow-lab/learning-record.mjs
          node --check airflow-lab/app.mjs
      - name: Run benchmark tests
        run: node --test airflow-lab/benchmark.test.mjs
      - name: Run WebGPU probe regression tests (no GPU adapter required)
        run: node --test airflow-lab/webgpu-validation.test.mjs
      - name: Verify Stage 2 D2Q9 solver math and UI (hardware GPU pending)
        run: node --test airflow-lab/gpu-solver.test.mjs
      - name: Live adaptive-batching and render scheduler tests
        run: node --test airflow-lab/live-performance.test.mjs
      - name: GPU experiment cadence and load governor regressions
        run: node --test airflow-lab/gpu-experiment.test.mjs
      - name: Stability recorder regressions
        run: node --test airflow-lab/stability-recorder.test.mjs
      - name: Matched classroom comparison and application protocol tests
        run: node --test airflow-lab/shape-comparison.test.mjs
      - name: Student learning record and export regressions
        run: node --test airflow-lab/learning-record.test.mjs
      - name: Student WebGPU integration regressions
        run: node --test airflow-lab/student-gpu-integration.test.mjs
      - name: Verify GPU relative force and independent Rust WASM reference
        run: node --test airflow-lab/gpu-relative-force.test.mjs
      - name: Validate WGSL shader syntax and semantics with Naga
        run: |
          npx --yes naga-wasi-cli@0.1.0 airflow-lab/d2q9.wgsl
          npx --yes naga-wasi-cli@0.1.0 airflow-lab/d2q9-solver.wgsl
          npx --yes naga-wasi-cli@0.1.0 airflow-lab/d2q9-solver-r2-20261010.wgsl
          npx --yes naga-wasi-cli@0.1.0 airflow-lab/student-gpu-stir-v1.wgsl
          npx --yes naga-wasi-cli@0.1.0 airflow-lab/gpu-relative-force-v1.wgsl

