<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Ping Pong</title>
    
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google MediaPipe for Real-time Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- p5.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <style>
        body { background-color: #0f172a; color: white; margin: 0; overflow: hidden; }
        #canvas-container canvas {
            /* Removed heavy box-shadow for performance */
            border-radius: 12px;
            /* 將背景顏色交給 p5.js 的 background() 處理，避免殘影 */
        }
        .neon-text-pink { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; }
        .neon-text-cyan { text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center font-sans bg-[#0f172a] p-4">

    <!-- Hidden Video Element for MediaPipe -->
    <video id="input_video" class="hidden" autoplay playsinline style="display: none;"></video>

    <!-- Main Game Container 結構優化：使用相對定位的外框，讓介面完美疊加 -->
    <div class="relative w-full max-w-[1024px] aspect-[4/3] rounded-2xl overflow-hidden shadow-2xl border border-slate-800 bg-[#1e293b]">
        
        <!-- UI Overlay: Start Screen -->
        <div id="start-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm p-10 text-center">
            <h1 class="text-5xl font-black mb-6 tracking-wider">
                <span class="text-pink-500 neon-text-pink">HAND</span> 
                <span class="text-white">PONG</span> 
                <span class="text-cyan-500 neon-text-cyan">TRACKER</span>
            </h1>
            <p class="text-slate-300 mb-8 max-w-md text-lg">
                Use your webcam to play! Step back so the camera sees your hands. <br><br>
                <b class="text-pink-400">Left Hand</b> controls the left paddle.<br>
                <b class="text-cyan-400">Right Hand</b> controls the right paddle.<br>
                <i>The paddles follow your index fingers.</i>
            </p>

            <!-- 難度選擇區塊 -->
            <div class="mb-8 flex flex-col items-center">
                <p class="text-slate-400 mb-3 text-sm font-bold uppercase tracking-widest">Select Speed</p>
                <div class="flex gap-3 bg-slate-800 p-1.5 rounded-xl">
                    <button id="btn-slow" class="px-6 py-2 rounded-lg text-slate-300 hover:text-white transition-colors">Slow</button>
                    <button id="btn-normal" class="px-6 py-2 rounded-lg bg-slate-600 text-white font-bold shadow-md transition-colors">Normal</button>
                    <button id="btn-fast" class="px-6 py-2 rounded-lg text-slate-300 hover:text-white transition-colors">Fast</button>
                </div>
            </div>

            <button id="start-btn" class="px-8 py-4 bg-white text-slate-900 font-bold rounded-full text-xl hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.4)] cursor-pointer">
                Enable Camera & Play
            </button>
        </div>

        <!-- UI Overlay: Loading Screen -->
        <div id="loading-screen" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm p-12 text-center">
            <div class="w-16 h-16 border-4 border-slate-600 border-t-white rounded-full animate-spin mb-4"></div>
            <p class="text-xl font-medium text-white animate-pulse">Loading AI Hand Tracking...</p>
            <p class="text-sm text-slate-400 mt-2">Please allow camera permissions if prompted.</p>
        </div>

        <!-- p5.js Canvas Container -->
        <div id="canvas-container" class="hidden absolute inset-0 z-10 w-full h-full"></div>
    </div>

    <script>
        // --- DOM Elements ---
        const videoElement = document.getElementById('input_video');
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const loadingScreen = document.getElementById('loading-screen');

        // --- Game State & Constants ---
        let gameState = 'start'; // start, loading, playing
        let latestHandResults = null;

        let leftPaddle, rightPaddle, ball;

        // --- 球速與難度設定 ---
        const speedSettings = {
            slow: { vx: 6, vy: 4, multiplier: 1.02 },
            normal: { vx: 10, vy: 6, multiplier: 1.05 },
            fast: { vx: 16, vy: 8, multiplier: 1.10 }
        };
        let currentSpeedMode = 'normal';

        // --- p5.js Setup ---
        function setup() {
            // Create canvas and attach it to the div container
            let canvas = createCanvas(1024, 768);
            canvas.parent('canvas-container');
            
            // Make p5 canvas responsive so it doesn't break layout
            canvas.style('width', '100%');
            canvas.style('height', '100%');
            
            // Initialize game objects
            leftPaddle = { x: 30, y: height/2 - 60, targetY: height/2 - 60, w: 20, h: 140, score: 0, color: color('#ec4899') };
            rightPaddle = { x: width - 50, y: height/2 - 60, targetY: height/2 - 60, w: 20, h: 140, score: 0, color: color('#06b6d4') };
            
            // 基礎球體屬性 (速度與倍率將在 resetBall() 根據選擇難度覆蓋)
            ball = { x: width/2, y: height/2, vx: 10, vy: 5, size: 16, color: color('#ffffff'), speedMultiplier: 1.05 };
            
            noStroke();
        }

        // --- Game Logic ---
        function resetBall() {
            const settings = speedSettings[currentSpeedMode];
            ball.x = width / 2;
            ball.y = height / 2;
            // 套用玩家選擇的速度
            ball.vx = (Math.random() > 0.5 ? settings.vx : -settings.vx);
            ball.vy = (Math.random() * (settings.vy * 2)) - settings.vy;
            ball.speedMultiplier = settings.multiplier;
        }

        function updateGame() {
            // 1. Move paddles smoothly towards hand targets
            leftPaddle.y += (leftPaddle.targetY - leftPaddle.y) * 0.25; // Increased snap speed
            rightPaddle.y += (rightPaddle.targetY - rightPaddle.y) * 0.25;

            // Constrain paddles to screen
            leftPaddle.y = constrain(leftPaddle.y, 0, height - leftPaddle.h);
            rightPaddle.y = constrain(rightPaddle.y, 0, height - rightPaddle.h);

            // 2. Move Ball
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 3. Wall Collisions (Top & Bottom)
            if (ball.y <= 0) {
                ball.y = 0;
                ball.vy *= -1;
            } else if (ball.y + ball.size >= height) {
                ball.y = height - ball.size;
                ball.vy *= -1;
            }

            // 4. Paddle Collisions
            // Left Paddle
            if (ball.vx < 0 && 
                ball.x <= leftPaddle.x + leftPaddle.w && 
                ball.x + ball.size >= leftPaddle.x &&
                ball.y + ball.size >= leftPaddle.y && 
                ball.y <= leftPaddle.y + leftPaddle.h) {
                
                ball.x = leftPaddle.x + leftPaddle.w; // Prevent sticking
                ball.vx *= -ball.speedMultiplier; // Bounce & speed up
                
                let hitPoint = (ball.y + ball.size/2) - (leftPaddle.y + leftPaddle.h/2);
                ball.vy = hitPoint * 0.15; 
            }

            // Right Paddle
            if (ball.vx > 0 && 
                ball.x + ball.size >= rightPaddle.x && 
                ball.x <= rightPaddle.x + rightPaddle.w &&
                ball.y + ball.size >= rightPaddle.y && 
                ball.y <= rightPaddle.y + rightPaddle.h) {
                
                ball.x = rightPaddle.x - ball.size; 
                ball.vx *= -ball.speedMultiplier; 
                
                let hitPoint = (ball.y + ball.size/2) - (rightPaddle.y + rightPaddle.h/2);
                ball.vy = hitPoint * 0.15;
            }

            // 5. Scoring
            if (ball.x < 0) {
                rightPaddle.score++;
                resetBall();
            } else if (ball.x > width) {
                leftPaddle.score++;
                resetBall();
            }
        }

        // --- p5.js Draw Loop (runs automatically ~60 FPS) ---
        function draw() {
            // 確保透明度狀態完全重置
            drawingContext.globalAlpha = 1.0;

            if (gameState !== 'playing') {
                background(30, 41, 59); // 實心深藍 #1e293b
                return;
            }

            // Update physics
            updateGame();

            // --- 全新背景渲染策略：徹底解決殘影 & 創造深藍濾鏡氛圍 ---
            if (videoElement.readyState >= 2) {
                // 1. 畫出 100% 不透明的原始攝影機畫面 
                // (這會直接用新畫面「完全覆蓋」上一幀，100% 消滅所有殘影)
                push();
                scale(-1, 1);
                drawingContext.drawImage(videoElement, -width, 0, width, height);
                pop();

                // 2. 疊加一層 85% (大約 alpha 220) 不透明度的深藍色遮罩
                // (這會把明亮的攝影機畫面壓暗，創造出截圖中那種沉穩的深藍色氛圍)
                fill(30, 41, 59, 220); // 30, 41, 59 是 #1e293b 的 RGB 值
                noStroke();
                rect(0, 0, width, height);
            } else {
                // 若相機尚未準備好，直接塗滿深藍色
                background(30, 41, 59);
            }

            // 確保後續的遊戲物件 (球、球拍、分數) 都是 100% 實心，疊加在深藍濾鏡之上
            drawingContext.globalAlpha = 1.0;

            // Draw Center Line
            stroke(255, 255, 255, 51); // White with ~20% opacity
            strokeWeight(4);
            drawingContext.setLineDash([15, 15]);
            line(width/2, 0, width/2, height);
            drawingContext.setLineDash([]); 
            noStroke();

            // Draw Scores
            textFont('sans-serif');
            textStyle(BOLD);
            textSize(80);
            fill(255, 255, 255, 76); // White with ~30% opacity
            textAlign(CENTER, TOP);
            text(leftPaddle.score, width/4, 100);
            text(rightPaddle.score, (width/4)*3, 100);

            // Draw Paddles (Shadows removed for performance)
            fill(leftPaddle.color);
            rect(leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h);
            fill(rightPaddle.color);
            rect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h);

            // Draw Ball (Shadows removed for performance)
            fill(ball.color);
            ellipseMode(CORNER); 
            ellipse(ball.x, ball.y, ball.size, ball.size);

            // Draw Hand Tracking Feedback (Index fingers)
            if (latestHandResults && latestHandResults.multiHandLandmarks) {
                for (const landmarks of latestHandResults.multiHandLandmarks) {
                    const indexTip = landmarks[8]; // 8 is the index finger tip
                    
                    // We mirror the X coordinate because the video is mirrored!
                    const mirroredX = 1.0 - indexTip.x;
                    const cx = mirroredX * width;
                    const cy = indexTip.y * height;

                    let handColor = mirroredX < 0.5 ? leftPaddle.color : rightPaddle.color;

                    // Draw tracking dot
                    fill(handColor);
                    ellipseMode(CENTER);
                    ellipse(cx, cy, 24, 24); 
                    
                    // Faint line connecting hand to paddle target
                    stroke(handColor);
                    strokeWeight(2);
                    drawingContext.globalAlpha = 0.3;
                    line(cx, cy, mirroredX < 0.5 ? leftPaddle.x + leftPaddle.w/2 : rightPaddle.x + rightPaddle.w/2, cy);
                    drawingContext.globalAlpha = 1.0;
                    noStroke();
                }
            }
        }

        // --- MediaPipe Hand Tracking Setup ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2, // Allow 2 hands max
            modelComplexity: 0, // <--- OPTIMIZATION: Set to 0 for maximum performance/least lag
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            // First time results come in, hide loading screen and show canvas
            if (gameState === 'loading') {
                loadingScreen.classList.add('hidden');
                document.getElementById('canvas-container').classList.remove('hidden');
                gameState = 'playing';
                resetBall(); // Start the game when tracking is ready
            }

            latestHandResults = results;

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Use Index Finger Tip (landmark 8)
                    const indexTip = landmarks[8];
                    const mirroredX = 1.0 - indexTip.x;
                    
                    const targetCanvasY = (indexTip.y * height) - (leftPaddle.h / 2);

                    if (mirroredX < 0.5) {
                        leftPaddle.targetY = targetCanvasY;
                    } else {
                        rightPaddle.targetY = targetCanvasY;
                    }
                }
            }
        });

        // <--- OPTIMIZATION: Lowered camera resolution requests to lighten the processing load
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 480,  
            height: 360
        });

        // --- Initialization ---
        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            gameState = 'loading';
            
            // Start the camera and hand tracking
            camera.start();
        });

        // --- 速度選擇按鈕邏輯 ---
        const btnSlow = document.getElementById('btn-slow');
        const btnNormal = document.getElementById('btn-normal');
        const btnFast = document.getElementById('btn-fast');

        function updateSpeedSelection(mode) {
            currentSpeedMode = mode;
            // 更新按鈕的視覺樣式 (UI 切換)
            const baseClass = "px-6 py-2 rounded-lg transition-colors ";
            const inactiveClass = baseClass + "text-slate-300 hover:text-white";
            const activeClass = baseClass + "bg-slate-600 text-white font-bold shadow-md";

            btnSlow.className = mode === 'slow' ? activeClass : inactiveClass;
            btnNormal.className = mode === 'normal' ? activeClass : inactiveClass;
            btnFast.className = mode === 'fast' ? activeClass : inactiveClass;
        }

        btnSlow.addEventListener('click', () => updateSpeedSelection('slow'));
        btnNormal.addEventListener('click', () => updateSpeedSelection('normal'));
        btnFast.addEventListener('click', () => updateSpeedSelection('fast'));

    </script>
</body>
</html>
