<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Ping Pong</title>
    
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google MediaPipe for Real-time Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { background-color: #0f172a; color: white; margin: 0; overflow: hidden; }
        #game_canvas {
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            background-color: #1e293b;
        }
        .neon-text-pink { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; }
        .neon-text-cyan { text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center font-sans">

    <!-- Hidden Video Element for MediaPipe -->
    <video id="input_video" class="hidden" autoplay playsinline></video>

    <!-- Main Game Container -->
    <div class="relative w-full max-w-5xl p-4 flex flex-col items-center">
        
        <!-- UI Overlay: Start Screen -->
        <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm rounded-xl m-4">
            <h1 class="text-5xl font-black mb-6 tracking-wider">
                <span class="text-pink-500 neon-text-pink">HAND</span> 
                <span class="text-white">PONG</span> 
                <span class="text-cyan-500 neon-text-cyan">TRACKER</span>
            </h1>
            <p class="text-slate-300 mb-8 max-w-md text-center text-lg">
                Use your webcam to play! Step back so the camera sees your hands. <br><br>
                <b class="text-pink-400">Left Hand</b> controls the left paddle.<br>
                <b class="text-cyan-400">Right Hand</b> controls the right paddle.<br>
                <i>The paddles follow your index fingers.</i>
            </p>
            <button id="start-btn" class="px-8 py-4 bg-white text-slate-900 font-bold rounded-full text-xl hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.4)]">
                Enable Camera & Play
            </button>
        </div>

        <!-- UI Overlay: Loading Screen -->
        <div id="loading-screen" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center bg-slate-900/90 rounded-xl m-4">
            <div class="w-16 h-16 border-4 border-slate-600 border-t-white rounded-full animate-spin mb-4"></div>
            <p class="text-xl font-medium animate-pulse">Loading AI Hand Tracking...</p>
            <p class="text-sm text-slate-400 mt-2">Please allow camera permissions if prompted.</p>
        </div>

        <!-- Game Canvas -->
        <canvas id="game_canvas" width="1024" height="768" class="w-full max-w-[1024px] aspect-[4/3] object-contain"></canvas>
    </div>

    <script>
        // --- DOM Elements ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('game_canvas');
        const ctx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const loadingScreen = document.getElementById('loading-screen');

        // --- Game State & Constants ---
        const CW = canvasElement.width;
        const CH = canvasElement.height;
        
        let gameState = 'start'; // start, loading, playing
        let latestHandResults = null;

        const leftPaddle = { x: 30, y: CH/2 - 60, targetY: CH/2 - 60, w: 20, h: 140, score: 0, color: '#ec4899' }; // Pink
        const rightPaddle = { x: CW - 50, y: CH/2 - 60, targetY: CH/2 - 60, w: 20, h: 140, score: 0, color: '#06b6d4' }; // Cyan
        
        const ball = { x: CW/2, y: CH/2, vx: 8, vy: 4, size: 16, color: '#ffffff', speedMultiplier: 1.05 };

        // --- Game Logic ---
        function resetBall() {
            ball.x = CW / 2;
            ball.y = CH / 2;
            // Send ball towards the player who just scored (randomize vertical)
            ball.vx = (Math.random() > 0.5 ? 8 : -8);
            ball.vy = (Math.random() * 8) - 4;
        }

        function updateGame() {
            if (gameState !== 'playing') return;

            // 1. Move paddles smoothly towards hand targets
            leftPaddle.y += (leftPaddle.targetY - leftPaddle.y) * 0.15;
            rightPaddle.y += (rightPaddle.targetY - rightPaddle.y) * 0.15;

            // Constrain paddles to screen
            leftPaddle.y = Math.max(0, Math.min(CH - leftPaddle.h, leftPaddle.y));
            rightPaddle.y = Math.max(0, Math.min(CH - rightPaddle.h, rightPaddle.y));

            // 2. Move Ball
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 3. Wall Collisions (Top & Bottom)
            if (ball.y <= 0) {
                ball.y = 0;
                ball.vy *= -1;
            } else if (ball.y + ball.size >= CH) {
                ball.y = CH - ball.size;
                ball.vy *= -1;
            }

            // 4. Paddle Collisions
            // Left Paddle
            if (ball.vx < 0 && 
                ball.x <= leftPaddle.x + leftPaddle.w && 
                ball.x + ball.size >= leftPaddle.x &&
                ball.y + ball.size >= leftPaddle.y && 
                ball.y <= leftPaddle.y + leftPaddle.h) {
                
                ball.x = leftPaddle.x + leftPaddle.w; // Prevent sticking
                ball.vx *= -ball.speedMultiplier; // Bounce & speed up
                
                // Add spin/angle based on where it hit the paddle
                let hitPoint = (ball.y + ball.size/2) - (leftPaddle.y + leftPaddle.h/2);
                ball.vy = hitPoint * 0.15; 
            }

            // Right Paddle
            if (ball.vx > 0 && 
                ball.x + ball.size >= rightPaddle.x && 
                ball.x <= rightPaddle.x + rightPaddle.w &&
                ball.y + ball.size >= rightPaddle.y && 
                ball.y <= rightPaddle.y + rightPaddle.h) {
                
                ball.x = rightPaddle.x - ball.size; // Prevent sticking
                ball.vx *= -ball.speedMultiplier; // Bounce & speed up
                
                // Add spin/angle based on where it hit the paddle
                let hitPoint = (ball.y + ball.size/2) - (rightPaddle.y + rightPaddle.h/2);
                ball.vy = hitPoint * 0.15;
            }

            // 5. Scoring
            if (ball.x < 0) {
                rightPaddle.score++;
                resetBall();
            } else if (ball.x > CW) {
                leftPaddle.score++;
                resetBall();
            }
        }

        // --- Drawing Logic ---
        function drawGame() {
            // Clear canvas
            ctx.clearRect(0, 0, CW, CH);

            // Draw Camera Feed faintly in the background (Mirrored)
            if (videoElement.readyState >= 2) {
                ctx.save();
                ctx.globalAlpha = 0.15;
                ctx.scale(-1, 1);
                // Draw mirrored video
                ctx.drawImage(videoElement, -CW, 0, CW, CH);
                ctx.restore();
            }

            // Draw Center Line
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(CW/2, 0);
            ctx.lineTo(CW/2, CH);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // Draw Scores
            ctx.font = 'bold 80px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.textAlign = 'center';
            ctx.fillText(leftPaddle.score, CW/4, 100);
            ctx.fillText(rightPaddle.score, (CW/4)*3, 100);

            // Draw Paddles
            drawRect(leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h, leftPaddle.color);
            drawRect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h, rightPaddle.color);

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ball.x + ball.size/2, ball.y + ball.size/2, ball.size/2, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = ball.color;
            ctx.fill();
            ctx.shadowBlur = 0; // reset

            // Draw Hand Tracking Feedback (Index fingers)
            if (latestHandResults && latestHandResults.multiHandLandmarks) {
                for (const landmarks of latestHandResults.multiHandLandmarks) {
                    const indexTip = landmarks[8]; // 8 is the index finger tip
                    
                    // We mirror the X coordinate because the video is mirrored!
                    const mirroredX = 1.0 - indexTip.x;
                    const cx = mirroredX * CW;
                    const cy = indexTip.y * CH;

                    ctx.beginPath();
                    ctx.arc(cx, cy, 12, 0, 2 * Math.PI);
                    // Color based on which side of the screen the hand is on
                    ctx.fillStyle = mirroredX < 0.5 ? leftPaddle.color : rightPaddle.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // Faint line connecting hand to paddle target
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(mirroredX < 0.5 ? leftPaddle.x + leftPaddle.w/2 : rightPaddle.x + rightPaddle.w/2, cy);
                    ctx.strokeStyle = ctx.fillStyle;
                    ctx.globalAlpha = 0.3;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // --- MediaPipe Hand Tracking Setup ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2, // Allow 2 hands max
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            // First time results come in, hide loading screen
            if (gameState === 'loading') {
                loadingScreen.classList.add('hidden');
                gameState = 'playing';
            }

            latestHandResults = results;

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Use Index Finger Tip (landmark 8)
                    const indexTip = landmarks[8];
                    const mirroredX = 1.0 - indexTip.x;
                    
                    // Target Y is the raw Y percentage mapped to Canvas Height
                    // We subtract half the paddle height to center the paddle on the finger
                    const targetCanvasY = (indexTip.y * CH) - (leftPaddle.h / 2);

                    // If hand is on the left half of the screen, control left paddle
                    if (mirroredX < 0.5) {
                        leftPaddle.targetY = targetCanvasY;
                    } 
                    // If hand is on the right half, control right paddle
                    else {
                        rightPaddle.targetY = targetCanvasY;
                    }
                }
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        // --- Initialization ---
        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            gameState = 'loading';
            
            // Start the camera and hand tracking
            camera.start();
            
            // Start the game rendering loop immediately
            resetBall();
            requestAnimationFrame(gameLoop);
        });

        // Initial draw before start
        drawGame();

    </script>
</body>
</html>
